<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate of Completion</title>
<style>
  :root { --navy: #1a3a6e; --gold: #d4a017; }
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    margin: 0; background: #f5f8fc;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 12px;
  }
  .toolbar { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; margin-bottom: 20px; }
  .toolbar button {
    background: var(--navy); color: #fff; border: 0; border-radius: 10px;
    font-size: 18px; font-weight: 700; padding: 14px 30px; cursor: pointer;
  }
  .toolbar p { color: #666; font-size: 13px; }

  .certificate {
    background: #fff; width: 100%; max-width: 800px; aspect-ratio: 8.5 / 11;
    border: 6px solid var(--navy); padding: 10px;
  }
  .inner {
    border: 2px solid var(--navy); height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6% 8%;
  }
  .laurel { font-size: 42px; margin: 0; }
  h1 { color: var(--navy); font-size: 40px; letter-spacing: 4px; margin: 10px 0 0; }
  .sub { color: var(--gold); font-style: italic; font-size: 22px; margin: 2px 0 30px; }
  .certifies { font-size: 17px; margin: 0 0 18px; }
  .child-name {
    color: var(--navy); font-size: 40px; font-weight: 700; margin: 0 0 26px;
    border-bottom: 2px solid #444; display: inline-block; padding: 0 24px 4px;
  }
  .name-line {
    width: 75%; border-bottom: 2px solid #444; height: 38px; margin: 0 auto;
  }
  .name-label { font-size: 12px; color: #777; margin: 4px 0 26px; }
  .completed { font-size: 17px; margin: 0 0 8px; }
  .book { color: var(--navy); font-weight: 700; font-style: italic; font-size: 21px; margin: 0 0 34px; }
  .date-line { font-size: 17px; margin: 0 0 30px; }
  .closing { color: var(--gold); font-style: italic; font-size: 18px; margin: 0; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .certificate { max-width: none; border-width: 6px; width: 100%; height: 100vh; aspect-ratio: auto; }
  }
  .toolbar .secondary {
    background: #fff; color: var(--navy); border: 2px solid var(--navy);
    margin-left: 8px;
  }
  @page { size: letter portrait; margin: 0.4in; }
</style>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
</head>
<body>
  <div class="toolbar">
    <button id="downloadBtn">⬇️ Download my certificate</button>
    <button class="secondary" onclick="window.print()">🖨️ Print</button>
    <p>Download saves a PNG you can print or share. Print works too — enable
       “Background graphics” for best results.</p>
  </div>

  <div class="certificate" id="certificate">
    <div class="inner">
      <p class="laurel">🏆</p>
      <h1>CERTIFICATE</h1>
      <p class="sub">of Completion</p>
      <p class="certifies">This certifies that</p>
      <div id="nameArea">
        <div class="name-line"></div>
        <p class="name-label">(name)</p>
      </div>
      <p class="completed">has successfully completed every question in</p>
      <p class="book" id="bookName">this workbook</p>
      <p class="date-line" id="dateLine">Date: ______________________</p>
      <p class="closing">Outstanding work — keep practicing!</p>
    </div>
  </div>

<script>
  // Book title + child's name come from ?book=…&name=… (set by the landing page),
  // with localStorage as a fallback in case a redirect dropped the query string.
  const params = new URLSearchParams(window.location.search);
  function val(key, store) {
    let v = params.get(key) || "";
    if (!v) { try { v = localStorage.getItem(store) || ""; } catch (e) {} }
    return v.trim();
  }
  const book = val("book", "certBook");
  const name = val("name", "certName");

  if (book) document.getElementById("bookName").textContent = book;

  // Fill in today's date (e.g. "June 12, 2026") instead of a blank line.
  const today = new Date().toLocaleDateString("en-US",
    { year: "numeric", month: "long", day: "numeric" });
  document.getElementById("dateLine").textContent = "Date: " + today;

  // Personalize the name line if we have a name; otherwise keep the blank line
  // so a bare scan still produces a fill-in-by-hand certificate.
  if (name) {
    document.getElementById("nameArea").innerHTML =
      '<p class="child-name"></p>';
    document.querySelector(".child-name").textContent = name;
  }

  // One-click PNG download (high-res), with print as the fallback.
  document.getElementById("downloadBtn").addEventListener("click", function () {
    const node = document.getElementById("certificate");
    const safe = (name || "certificate").replace(/[^a-z0-9]+/gi, "_").toLowerCase();
    if (!window.htmlToImage) { window.print(); return; }
    htmlToImage.toPng(node, { pixelRatio: 2, backgroundColor: "#ffffff" })
      .then(function (dataUrl) {
        const a = document.createElement("a");
        a.download = "certificate_" + safe + ".png";
        a.href = dataUrl;
        a.click();
      })
      .catch(function () { window.print(); });
  });
</script>
</body>
</html>
